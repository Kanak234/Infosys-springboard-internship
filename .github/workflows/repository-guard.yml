name: Repository Guard

# Conservative repository-level validation. This workflow only reads source files
# and parses code; it does not mutate files or execute application-specific actions.
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      # Syntax-only validation keeps mixed repositories safe without requiring
      # runtime dependencies or external services.
      - name: Validate Python syntax
        shell: bash
        run: |
          if find . -type f -name '*.py' -not -path './.git/*' | grep -q .; then
            python3 -m compileall -q .
          fi

      - name: Validate JavaScript syntax
        shell: bash
        run: |
          while IFS= read -r -d '' file; do node --check "$file"; done             < <(find . -type f -name '*.js' -not -path './.git/*' -not -path '*/node_modules/*' -print0)

      # Rust repositories receive a compile check; this uses Cargo's own manifest.
      - name: Validate Rust workspace
        shell: bash
        run: |
          if [ -f Cargo.toml ]; then cargo check --workspace --all-targets; fi

      # Shell scripts are parsed, not executed, preventing CI from running
      # repository automation merely because it was committed.
      - name: Validate shell syntax
        shell: bash
        run: |
          while IFS= read -r -d '' file; do bash -n "$file"; done             < <(find . -type f \( -name '*.sh' -o -name '*.bash' \) -not -path './.git/*' -print0)
